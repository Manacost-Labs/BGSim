# BGSim.Server on one machine (docs/server.md):
#
#   GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
#
# Listens on 127.0.0.1:8080 only: put a reverse proxy with TLS in front of it to reach it from outside. Settings come
# from the environment or an .env file next to this one (BGSIM_API_KEY, BGSIM_CORS_ORIGINS, ...).
services:
  bgsim:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: bgsim-server:local
    ports:
      - "127.0.0.1:${BGSIM_PORT:-8080}:8080"
    environment:
      BGSIM_API_KEY: ${BGSIM_API_KEY:-}
      BGSIM_CORS_ORIGINS: ${BGSIM_CORS_ORIGINS:-}
      BGSIM_MAX_CONCURRENT: ${BGSIM_MAX_CONCURRENT:-}
      BGSIM_QUEUE_LIMIT: ${BGSIM_QUEUE_LIMIT:-}
    read_only: true
    tmpfs:
      - /tmp:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256M
